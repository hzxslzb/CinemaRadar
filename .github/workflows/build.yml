name: Build Android and macOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --no-pub
      - name: Build macOS ZIP
        if: matrix.platform == 'macos'
        run: ./tool/build_macos_release.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CinemaRadar-${{ matrix.platform }}
          path: |
            build/app/outputs/flutter-apk/CinemaRadar-*.apk
            build/macos/CinemaRadar-*.zip
          if-no-files-found: error
